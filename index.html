<style>
:root{--green:#C8D400;--green-ink:#1C1F00;--pink:#E2186A;--pink-ink:#C4105A;--navy:#004A7C;--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--muted:#6E6E73;--line:#E5E5EA;--ok:#2F7A1F;--okbg:#E8F4E0;--radius:22px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
/* Sidebar (ordinateur) */
.side{display:none}
.main{flex:1;min-width:0;padding:calc(18px + var(--safe-t)) 18px calc(110px + var(--safe-b));max-width:1180px;margin:0 auto;width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:8px 4px calc(10px + var(--safe-b));background:rgba(249,249,251,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:#8A8A8E;text-decoration:none;min-width:58px;background:none;border:0;padding:2px}
.tab.on{color:var(--pink-ink)}
.tab svg{width:25px;height:25px}
@media (min-width:900px){
 .side{display:flex;flex-direction:column;gap:2px;width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:24px 14px;background:#fff;border-right:1px solid var(--line);overflow:auto}
 .tabbar{display:none}
 .main{padding:34px 40px 60px}
 .cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
 .grid3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
 .hide-desk{display:none!important}
}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:15px;font-weight:500;color:#3A3A3C;text-decoration:none;border:0;background:none;text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex-shrink:0}
.nav.on{background:#FCE3EE;color:var(--pink-ink);font-weight:700}
.navsec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8A8A8E;padding:16px 12px 4px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo i{width:15px;height:15px;border-radius:99px;border:3.5px solid var(--pink);display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.8px;margin:2px 0 0}
h2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:0}
h3{font-size:17px;font-weight:700;margin:0}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:22px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.dark{background:#1C1C1E;color:#fff}
.card.pink{background:var(--pink);color:#fff}
.card.navy{background:var(--navy);color:#fff}
.card.lime{background:var(--green);color:var(--green-ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:flex;flex-direction:column;gap:22px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.hscroll{margin:0;padding:2px 0 6px;flex-wrap:wrap}}
.chip{border:0;white-space:nowrap;font-size:14px;font-weight:600;padding:8px 14px;border-radius:99px;background:#fff;color:var(--ink)}
.chip.on{background:var(--pink);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-pink{background:#FCE3EE;color:var(--pink-ink)}.t-navy{background:#E1ECF5;color:var(--navy)}.t-lime{background:#F1F5C2;color:#4A4F00}.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:#FFE6DA;color:#B0410A}.t-grey{background:#F2F2F7;color:#3A3A3C}
.btn{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;background:var(--pink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #D1D1D6}
.btn.dark{background:#1C1C1E}.btn.lime{background:var(--green);color:var(--green-ink)}.btn.white{background:#fff;color:var(--pink-ink)}
.btn.full{width:100%}.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.iconbtn{width:42px;height:42px;border-radius:99px;border:0;background:#fff;display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:99px;background:var(--pink);border:2px solid #fff}
.search{display:flex;align-items:center;gap:8px;background:#E3E3E8;border-radius:12px;padding:10px 12px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid #E0E0E5;background:#FAFAFC;border-radius:12px;padding:12px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);background:#fff}
.list{background:#fff;border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #EDEDF0;min-height:50px;text-decoration:none;color:inherit;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:800;font-size:13px}
.av{width:50px;height:50px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.toggle{width:51px;height:31px;border-radius:99px;border:0;padding:2px;display:flex;flex-shrink:0;background:#E9E9EB;transition:background .2s}
.toggle span{width:27px;height:27px;border-radius:99px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:#34C759}.toggle.on span{transform:translateX(20px)}
.seg{display:flex;gap:3px;background:#E3E3E8;padding:3px;border-radius:11px}
.seg button{flex:1;border:0;background:transparent;font-size:14px;font-weight:600;padding:8px 6px;border-radius:9px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){.sheet-bg{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
.grab{width:38px;height:5px;border-radius:99px;background:#C7C7CC;margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:200;background:rgba(30,30,32,.94);color:#fff;border-radius:18px;padding:12px 16px;display:flex;gap:10px;align-items:center;max-width:92vw;width:380px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#map{height:380px;border-radius:22px;overflow:hidden;background:#EAF0E2;z-index:1}
@media (min-width:900px){#map{height:520px}}

async function verifyId(raw,kind){
  const s=String(raw||'').replace(/\s/g,'').toUpperCase();
  if(kind==='asso'&&/^W\d{9}$/.test(s)){
    try{const j=await getJSON('https://recherche-entreprises.api.gouv.fr/search?q='+s+'&per_page=1');const r=j.results&&j.results[0];
      if(r) return {ok:true,live:true,name:r.nom_complet,addr:(r.siege&&r.siege.adresse)||'',orsay:/ORSAY/i.test((r.siege&&r.siege.libelle_commune)||'')};
      return {ok:false,msg:'Ce numéro RNA est introuvable dans les registres publics.'}}catch(e){return {ok:true,live:false,msg:'Format RNA valide · vérification en ligne indisponible ici'}}
  }
  if(!/^\d{14}$/.test(s)) return {ok:false,msg:kind==='asso'?'Saisis un numéro RNA (W + 9 chiffres) ou un SIRET (14 chiffres).':'Un SIRET contient 14 chiffres.'};
  let sum=0;for(let i=0;i<14;i++){let n=+s[13-i];if(i%2){n*=2;if(n>9)n-=9}sum+=n}
  if(sum%10!==0) return {ok:false,msg:'Ce numéro SIRET n’est pas valide (clé de contrôle).'};
  try{
    const j=await getJSON('https://recherche-entreprises.api.gouv.fr/search?q='+s+'&per_page=1');
    const r=j.results&&j.results[0]; if(!r) return {ok:false,msg:'Aucun établissement trouvé pour ce SIRET.'};
    const et=(r.matching_etablissements||[]).find(e=>e.siret===s)||r.siege||{};
    const active=(et.etat_administratif||r.etat_administratif)==='A';
    const orsay=/ORSAY/i.test(et.libelle_commune||'')||String(et.code_postal||'')==='91400';
    if(!active) return {ok:false,msg:'Cet établissement est indiqué comme fermé dans le répertoire SIRENE.'};
    return {ok:true,live:true,orsay,name:(et.liste_enseignes&&et.liste_enseignes[0])||r.nom_complet,addr:et.adresse||''};
  }catch(e){return {ok:true,live:false,msg:'Numéro valide · vérification SIRENE indisponible ici (fonctionne sur la version en ligne)'}}
}

function collecteSheet(){const u=me();

  '<button class="btn full" data-a="csave">Enregistrer</button></div>');
  const inp=$('#cadr');if(!inp)return;
  const upd=debounce(async()=>{const q=inp.value.trim(),box=$('#cadrsug');$('#czone').innerHTML=zoneCard(q,{collecteManual:false});if(!box)return;
    if(q.length<3){box.innerHTML='';return}

    let sug=STREETS.filter(st=>norm(st).includes(rest)).slice(0,5).map(st=>(num?num+' ':'')+st);
    const exact=sug.some(x=>norm(x)===norm(q));
    const draw=list=>{box.innerHTML=exact?'':list.map(l=>'<button class="li" style="background:#F2F2F7;border-radius:12px;border:0" data-a="cadrpick" data-v="'+esc(l)+'">'+ico('pin',16,'#C4105A')+'<span>'+esc(l)+'<span class="muted">, 91400 Orsay</span></span></button>').join('')};
    draw(sug);

  },200);
  inp.addEventListener('input',upd);

const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'-]/g,' ').replace(/\s+/g,' ').trim();
/* Zones de collecte SIOM à Orsay — d'après le calendrier publié par le SIOM (nouvelles tournées depuis avril 2022) */
const ZONE_CENTRE=['rue boursier','docteur ernest lauriat','docteur lauriat','rue verrier','rue de paris'];
const ZONE_COLLECTIF=['rue archange','marechal foch','rue charles de gaulle','boulevard dubreuil','charles peguy','residence'];
const ZONE_IUT=['plateau du moulon','faculte','universite','domaine de corbeville','rue jean teillac','nicolas appert'];
const ZONES={
 individuel:{l:'Habitat individuel & petit collectif',c:{om:[2],emb:[4],bio:[4],veg:[2]}},
 collectif:{l:'Habitat collectif',c:{om:[4],emb:[2],bio:[4],veg:[]}},
 centre:{l:'Centre-ville',c:{om:[1,2,3,4,5,6],emb:[2,4],bio:[4],veg:[]},warn:true},
 iut:{l:'Zone campus / IUT',c:null}
};
function zoneFor(addr){const a=norm(addr);if(!a)return null;if(ZONE_IUT.some(k=>a.includes(k)))return 'iut';if(ZONE_CENTRE.some(k=>a.includes(k)))return 'centre';if(ZONE_COLLECTIF.some(k=>a.includes(k)))return 'collectif';return 'individuel'}
function vegSeason(d){const m=d.getMonth()+1,day=d.getDate();return (m>3&&m<11)||(m===3&&day>=15)||(m===11&&day<=15)}
const WASTE=[['om','Ordures ménagères','#8E8E93'],['emb','Emballages & papiers','#E0B000'],['bio','Biodéchets','#8B5A2B'],['veg','Déchets végétaux','#2F7A1F']];
const DJ=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
function collecte(u){if(!u.collecteManual){const z=zoneFor(u.adresse);if(z&&ZONES[z].c){u.collecte=JSON.parse(JSON.stringify(ZONES[z].c));return u.collecte}}u.collecte=u.collecte||{om:[],emb:[],bio:[4],veg:[]};return u.collecte}
function nextCollect(u){const c=collecte(u),now=new Date();for(let k=0;k<8;k++){const d=new Date(now);d.setDate(now.getDate()+k);const types=WASTE.filter(w=>(c[w[0]]||[]).includes(d.getDay())&&(w[0]!=='veg'||vegSeason(d)));if(types.length&&!(k===0&&now.getHours()>=13))return {k,d,types}}return null}
function collecteTxt(u){if(!u.adresse)return 'Ajoute ton adresse';const c=collecte(u);if(!c.om.length&&!c.emb.length)return 'Voir siom.fr';const n=nextCollect(u);if(!n)return '—';const names=n.types.map(t=>t[1].split(' ')[0]).join(' + ');return (n.k===0?'Aujourd’hui':n.k===1?'Demain':DJ[n.d.getDay()])+' : '+names}
function cineKey(d){return ['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()]}

let MAP=null;
async function initMap(){
  const el=$('#map'); if(!el) return;
  const note=$('#mapnote');
  if(typeof L==='undefined'){el.innerHTML='<div class="empty" style="padding-top:150px">Carte indisponible ici.</div>';return}
  try{
    const map=L.map(el,{zoomControl:true,attributionControl:true}).setView([48.6985,2.1875],14);MAP=map;
    let tileErr=0;
    const tl=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap · © CARTO'}).addTo(map);
    tl.on('tileerror',()=>{tileErr++;if(tileErr===4&&note)note.innerHTML='Le fond de carte ne se charge pas dans cet aperçu : il s’affiche sur la version en ligne de l’app.'});
    const items=explorerItems().filter(i=>i.a);
    let placed=0;
    for(const i of items){
      const ll=await geocode(i.a); if(!el.isConnected) return; if(!ll) continue;
      const c=CATS[i.cat]||CATS.services;
      const m=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="pin" style="background:'+c.c+'"><b>'+c.i+'</b></div>',iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]})}).addTo(map);
      m.bindPopup('<b>'+esc(i.n)+'</b><br><span style="color:#6E6E73">'+esc(i.a)+'</span><br><a href="#" data-a="commerce" data-v="'+i.id+'" style="color:#C4105A;font-weight:700">Voir la fiche</a>');
      placed++;
    }
    if(!placed&&note) note.innerHTML='Les adresses n’ont pas pu être placées ici (accès réseau bloqué dans l’aperçu). Sur la version en ligne, chaque commerce est placé automatiquement via la Base Adresse Nationale.';
  }catch(e){el.innerHTML='<div class="empty" style="padding-top:150px">Carte indisponible ici.</div>'}
}

    if(t==='benevolat'){DB.assoNeeds.push({id:uid(),owner:u.id,by:u.nom,t:d.t,when:d.when||'',volunteers:[]})}
    DB.posts.push({id:uid(),owner:u.id,type:t,by:u.nom,t:d.t,x:d.x||'',when:d.when||'',prix:t==='panier'?d.prix:'',val:t==='panier'?d.val:'',qte:+d.qte||0});save();render();
    toast(t==='panier'?'Panier anti-gaspi':t==='bonplan'?'Bon plan':t==='benevolat'?'Bénévolat':'Événement',u.nom+' : '+d.t)});
  const fc=$('#fcours');if(fc)fc.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fc));const u=me();DB.courses.push({id:uid(),owner:u.id,by:u.nom,t:d.t,when:d.when,prix:d.prix,places:+d.places||8,inscrits:0});save();render();toast('Nouvel atelier',u.nom+' : '+d.t)});

}
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}}

/* ---------- Actions ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v, u=me();
  if(a==='bg'&&e.target!==el) return;
  if(el.tagName==='A'&&a==='commerce'){e.preventDefault()}
  switch(a){
    case 'onb': if(v==='welcome'){UI.form={};UI.formErr=''}UI.onbStep=v;UI.verify=null;render();break;
    case 'pickrole': if(UI.onbRole!==v)UI.verify=null;UI.onbRole=v;UI.formErr='';render();break;
    case 'verify': {const inp=document.querySelector('[name=sid]');el.textContent='Vérification…';el.disabled=true;UI.verify=await verifyId(inp&&inp.value,UI.onbRole==='asso'?'asso':'pro');const keep=inp?inp.value:'';render();const n=document.querySelector('[name=sid]');if(n)n.value=keep;break}

    case 'goto': go(v);break;
    case 'travaux': go('infos');setTimeout(()=>{const t=$('#travaux');if(t)t.scrollIntoView({behavior:'smooth'})},80);break;
    case 'xcat': UI.explorerCat=v;render();break;
    case 'acat': UI.assoCat=v;render();break;
    case 'cineday': UI.cineDay=v;render();break;
    case 'agtab': UI.agendaTab=v;render();break;
    case 'commerce': commerceSheet(v);break;
    case 'close': case 'bg': closeSheet();break;
    case 'addcard': {const mine=DB.cards[u.id]=DB.cards[u.id]||{};if(mine[v]){delete mine[v]}else{const i=COMMERCES.find(x=>x.id===v);const owner=v.startsWith('u')?DB.users.find(x=>'u'+x.id===v):null;const f=owner&&owner.fid||{type:'tampons',seuil:10,reco:'Formule à définir par le commerçant'};mine[v]={n:i?i.n:owner?owner.nom:'Commerce',type:f.type,seuil:+f.seuil||10,reco:f.reco,count:0}}save();commerceSheet(v);break}
    case 'reserve': {const p=DB.posts.find(x=>x.id===v);if(p){p.reserved=!p.reserved;save();render();if(p.reserved)toast('Réservé',p.t+' · '+(p.when||''))}else{toast('Exemple','Dans l’app, la réservation est envoyée au commerçant.')}break}
    case 'bookcourse': {const c=DB.courses.find(x=>x.id===v);if(c){if(c.me){c.me=false;c.inscrits--}else if(c.inscrits<c.places){c.me=true;c.inscrits++;toast('Atelier réservé',c.t+' · '+c.when)}else toast('Complet','Tu es sur liste d’attente : on te prévient si une place se libère.');save();render()}break}
    case 'notif': u.notif=u.notif||{};u.notif[v]=!u.notif[v];save();if(v==='collecte'){const a=$('#cadr')?$('#cadr').value:'';const y=document.querySelector('.sheet').scrollTop;collecteSheet();if($('#cadr'))$('#cadr').value=a;document.querySelector('.sheet').scrollTop=y}else render();break;
    case 'interest': {u.interests=u.interests||[];const i=u.interests.indexOf(v);i>=0?u.interests.splice(i,1):u.interests.push(v);save();render();break}
    case 'benevole': u.benevole=u.benevole||{};u.benevole.on=!u.benevole.on;save();render();break;
    case 'share': u.benevole.share=!u.benevole.share;save();render();break;
    case 'volunteer': {const n=DB.assoNeeds.find(x=>x.id===v);if(n){n.volunteers=n.volunteers||[];const i=n.volunteers.indexOf(u.id);i>=0?n.volunteers.splice(i,1):(n.volunteers.push(u.id),toast('Merci !',n.by+' a reçu ton contact.'));save();render()}break}
    case 'pharma': openSheet('<div class="stack"><div class="between"><div><div class="lbl">Ouverte maintenant</div><h2>Pharmacie de garde</h2></div><button class="iconbtn" data-a="close" aria-label="Fermer">'+ico('x',18)+'</button></div>'+pharmaWidget()+'</div>');break;
    case 'switch': loginAs(v);break;
    case 'addaccount': {const em=u.email;DB.session=null;save();UI.form={email:em};UI.formErr='';UI.onbStep='role';location.hash='';render();break}
    case 'asso': assoSheet(v);break;
    case 'photo': pickPhoto();break;
    case 'delask': openSheet('<div class="stack" style="text-align:center"><div style="width:56px;height:56px;border-radius:99px;background:#FFE5E7;display:flex;align-items:center;justify-content:center;margin:0 auto">'+ico('trash',26,'#D70015',2.2)+'</div><h2>Supprimer ce compte ?</h2><div class="muted">'+esc(u.nom)+' · '+roleLabel(u.role)+'<br>'+(['commercant','atelier','asso'].includes(u.role)?'Ta fiche, tes publications, tes cours et ta carte de fidélité seront supprimés.':'Tes cartes de fidélité, tes points et tes préférences seront supprimés.')+' Cette action est définitive.</div><button class="btn full" style="background:#D70015" data-a="deldo">Supprimer définitivement</button><button class="btn sec full" data-a="close">Annuler</button></div>');break;
    case 'deldo': {const id=u.id,key='u'+id;DB.users=DB.users.filter(x=>x.id!==id);DB.posts=DB.posts.filter(p=>p.owner!==id);DB.courses=DB.courses.filter(c=>c.owner!==id);DB.assoNeeds=DB.assoNeeds.filter(n=>n.owner!==id);DB.reports=DB.reports.filter(r=>r.by!==id);DB.visits=(DB.visits||[]).filter(x=>x.shop!==id&&x.client!==id);delete DB.cards[id];Object.values(DB.cards).forEach(m=>{delete m[key]});
      const other=DB.users.find(x=>x.email&&u.email&&x.email.toLowerCase()===u.email.toLowerCase());closeSheet();
      if(other){loginAs(other.id);toast('Compte supprimé','Tu es maintenant sur ton compte '+roleLabel(other.role).toLowerCase()+'.')}else{DB.session=null;save();UI.onbStep='welcome';location.hash='';render();toast('Compte supprimé','Toutes tes données ont été effacées de cet appareil.')}break}

    case 'collecte': collecteSheet();break;
    case 'cday': {const [k,d]=v.split(':');const c=collecte(u);c[k]=c[k]||[];const i=c[k].indexOf(+d);i>=0?c[k].splice(i,1):c[k].push(+d);save();const y=document.querySelector('.sheet').scrollTop;const a=$('#cadr')?$('#cadr').value:'';collecteSheet();if($('#cadr'))$('#cadr').value=a;document.querySelector('.sheet').scrollTop=y;break}
    case 'cadrpick': $('#cadr').value=v;$('#cadrsug').innerHTML='';$('#czone').innerHTML=zoneCard(v,{collecteManual:false});break;
    case 'csave': u.adresse=($('#cadr')&&$('#cadr').value.trim())||u.adresse||'';u.collecteManual=false;u.collecte=null;save();closeSheet();render();toast('Collecte',collecteTxt(u));break;
    case 'demotoggle': DB.demo=!DB.demo;save();render();break;
    case 'report': openSheet('<form class="stack" id="freport"><div class="between"><h2>Signaler un problème</h2><button type="button" class="iconbtn" data-a="close" aria-label="Fermer">'+ico('x',18)+'</button></div><div class="card stack-s"><label class="field">Quoi ?<select name="t"><option>Lampadaire éteint</option><option>Dépôt sauvage</option><option>Nid-de-poule</option><option>Graffiti</option><option>Autre</option></select></label><label class="field" id="rautre" style="display:none">Précise le problème<input name="autre" placeholder="ex. banc cassé, arbre tombé…"></label><label class="field">Où ?<input name="lieu" required placeholder="ex. 12 rue de Paris"></label><label class="field">Photo<input type="file" accept="image/*" name="photo"></label></div><button class="btn full" type="submit">Envoyer à la mairie</button></form>');
      const rs=document.querySelector('#freport select[name=t]');rs.addEventListener('change',()=>{const on=rs.value==='Autre';$('#rautre').style.display=on?'flex':'none';const ai=$('#rautre input');ai.required=on;if(on)ai.focus()});
      $('#freport').addEventListener('submit',ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));if(d.t==='Autre'&&d.autre)d.t=d.autre.trim();DB.reports.push({id:uid(),by:u.id,t:d.t,lieu:d.lieu,status:'Nouveau'});save();closeSheet();render();toast('Signalement envoyé','La mairie a reçu : '+d.t+' · '+d.lieu)});break;
    case 'rstatus': {const r=DB.reports.find(x=>x.id===v);if(r){r.status=r.status==='Nouveau'?'Transmis':r.status==='Transmis'?'Réparé':'Nouveau';save();render()}break}
    case 'logout': DB.session=null;save();UI.onbStep='welcome';location.hash='';render();break;
    case 'protab': UI.proTab=v;render();break;
    case 'pubtype': UI.pubType=v;render();break;
    case 'unpub': DB.posts=DB.posts.filter(p=>p.id!==v);save();render();break;
    case 'mtab': UI.mairieTab=v;render();break;
    case 'fidtype': u.fid=u.fid||{};u.fid.type=v;save();render();break;
    case 'fidetu': u.fid.etudiant=!u.fid.etudiant;save();render();break;
    case 'fidsave': u.fid.seuil=+($('#fseuil').value)||10;u.fid.reco=$('#freco').value||'1 produit offert';save();render();toast('Carte de fidélité','Nouvelle formule enregistrée.');break;
    case 'booking': u.booking=v;save();render();break;
    case 'ficheSave': u.nom=$('#pnom').value||u.nom;u.adr=$('#padr').value;u.desc=$('#pdesc').value;if($('#plink'))u.link=$('#plink').value;save();render();toast('Fiche','Modifications en ligne.');break;
    case 'cscan': {const code=($('#ccode').value||'').trim().toUpperCase();const cl=DB.users.find(x=>x.code===code&&x.role!=='mairie');if(!cl){toast('Client introuvable','Vérifie le code sous son QR code.');break}
      const cards=DB.cards[cl.id]=DB.cards[cl.id]||{};const key='u'+u.id;UI.caisse={step:'found',client:cl,card:cards[key]||null};render();break}
    case 'cuse': UI.caisse.use=!UI.caisse.use;render();break;
    case 'ccheque': UI.caisse.cheque=!UI.caisse.cheque;render();break;
    case 'cvalid': {const c=UI.caisse,cl=c.client;const amt=parseFloat(String($('#camount').value||'0').replace(',','.'))||0;const f=u.fid||{type:'tampons',seuil:10,reco:'1 produit offert'};
      const cards=DB.cards[cl.id]=DB.cards[cl.id]||{};const key='u'+u.id;const card=cards[key]=cards[key]||{n:u.nom,type:f.type,seuil:+f.seuil||10,reco:f.reco,count:0};
      let msg='';if(c.use){card.count=0;msg+='Récompense utilisée · carte remise à zéro. '}
      if(card.type==='tampons')card.count=Math.min(card.seuil,card.count+(amt>0?1:0));else card.count=Math.round((card.count+amt)*100)/100;
      const pts=Math.round(amt);cl.points=(cl.points||0)+pts;cl.history=cl.history||[];if(c.cheque){cl.points-=1000;cl.history.push({t:'Chèque ville utilisé chez '+u.nom,v:-1000});msg+='Chèque de 10 € déduit. '}
      if(pts)cl.history.push({t:u.nom+' · ticket '+amt.toFixed(2).replace('.',',')+' €',v:pts});
      DB.visits=DB.visits||[];DB.visits.push({shop:u.id,client:cl.id,amt,at:Date.now()});save();
      UI.caisse={step:'done',msg:msg+'+'+pts+' pts ville · carte '+(card.type==='tampons'?card.count+'/'+card.seuil:card.count+(card.type==='points'?' pts':' €'))};render();break}
    case 'creset': UI.caisse={step:'idle'};render();break;
    case 'wallet': toast('Apple Wallet','Dans l’app finale, la carte s’ajoute à Cartes (Wallet) et se met à jour toute seule.');break;
    case 'notifs': {const list=DB.posts.slice().reverse();openSheet('<div class="stack"><div class="between"><h2>Notifications</h2><button class="iconbtn" data-a="close" aria-label="Fermer">'+ico('x',18)+'</button></div>'+(list.length?'<div class="list">'+list.map(p=>'<div class="li"><div class="logo" style="width:32px;height:32px;border-radius:9px"><i style="width:12px;height:12px;border-width:3px"></i></div><div><div style="font-weight:600">'+esc(p.t)+'</div><div class="small muted">'+esc(p.by)+'</div></div></div>').join('')+'</div>':'<div class="card empty">Rien de neuf. Tu choisis tes notifications dans ton profil.</div>')+'</div>');break}
  }
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a="dispo"]');if(el){me().benevole.dispo=el.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='globalsearch'){UI.explorerQ=e.target.value;UI.explorerCat='tout';go('explorer')}if(e.key==='Escape')closeSheet()});

render();
loadLiveActus();
</script>
</body>
</html>
